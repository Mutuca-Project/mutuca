site_name: Mutuca 
repo_url: https://github.com/dvths/mutuca
repo_name: mutuca
edit_uri: tree/main/docs
theme:
  palette:
    scheme: slate
    primary: teal 
    accent: cyan
  features:
    - header.autohide
  name: material
  language: pt-BR
  logo: assets/mutuca-darktheme.png
  favicon: assets/mutuca-darktheme.png
markdown_extensions:  
 - pymdownx.highlight:
    anchor_linenums: true
 - pymdownx.superfences
 - attr_list 
extra_css:
  - assets/stylesheets/extra.css
plugins: 
  - mkdocs-jupyter

nav:
  - Home: index.md
  - Tutoriais:
    - prefeitura_municipal/contratos_licitacoes.ipynb
    - prefeitura_municipal/obras_publicas.ipynb
    - prefeitura_municipal/receitas.ipynb


